<!-- Sidebar: brand + nav links -->
<div class="sidebar-brand">
  <div class="sidebar-brand-label">Workspace</div>
  <div class="sidebar-brand-name">Access Tool</div>
</div>

<nav class="sidebar-nav" *ngIf="isloggedIn">

  <!-- Analytics -->
  <div class="sidebar-section-label">Analytics</div>

  <a class="sidebar-link"
     routerLink="/home"
     routerLinkActive="active-link"
     [routerLinkActiveOptions]="{ exact: true }">
    <i class="pi pi-chart-bar"></i>
    Power BI Analytics
  </a>

  <a class="sidebar-link"
     routerLink="/users"
     routerLinkActive="active-link">
    <i class="pi pi-users"></i>
    Users
  </a>

  <a class="sidebar-link"
     routerLink="/dashboard-tab-usage"
     routerLinkActive="active-link">
    <i class="pi pi-table"></i>
    Tab Usage
  </a>

  <a class="sidebar-link"
     routerLink="/dashboards"
     routerLinkActive="active-link">
    <i class="pi pi-th-large"></i>
    Dashboards
  </a>

  <!-- Admin only -->
  <ng-container *ngIf="isAdmin">
    <div class="sidebar-section-label" style="margin-top: 0.75rem;">Admin</div>

    <a class="sidebar-link"
       routerLink="/user-management"
       routerLinkActive="active-link">
      <i class="pi pi-user-edit"></i>
      User Management
    </a>

    <!-- Master Data - Hidden from navigation -->
    <!-- <a class="sidebar-link"
       routerLink="/masterdata"
       routerLinkActive="active-link">
      <i class="pi pi-database"></i>
      Master Data
    </a> -->
  </ng-container>

</nav>

<!-- Sidebar bottom: logout -->
<div class="sidebar-footer" *ngIf="isloggedIn">
  <button class="sidebar-logout-btn" (click)="logout()">
    <i class="pi pi-sign-out"></i>
    Logout
  </button>
</div>
