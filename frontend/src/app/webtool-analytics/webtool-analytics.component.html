  <!-- Loading Indicator -->
  <ng-container *ngIf="!chartsInitialized">
    <div class="flex justify-center items-center h-64">
      <div class="animate-pulse flex flex-col items-center">
        <div class="w-16 h-16 bg-blue-400 rounded-full mb-4"></div>
        <p class="text-gray-500 text-lg">Loading webtool data...</p>
      </div>
    </div>
  </ng-container>

  <!-- Dashboard Content -->
  <ng-container *ngIf="chartsInitialized">
    <!-- Filter Section -->
    <div class="bg-white p-6 shadow-md mt-4 mx-4 md:mx-8 rounded-lg">
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <!-- Webtool Dropdown -->
        <div class="w-full">
          <label class="block text-sm font-medium text-gray-700 mb-2">Select Webtool</label>
          <select
            [(ngModel)]="selectedWebtool"
            (change)="filterByWebtool()"
            class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          >
            <option value="all">All Webtools</option>
            <option *ngFor="let webtool of webtools" [value]="webtool.id">
              {{ webtool.webtool }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6 mb-6 mx-4 md:mx-8">
      <div class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow">
        <h3 class="text-md font-semibold text-gray-700 mb-2">Total Webtools</h3>
        <p class="text-2xl font-bold text-blue-600">{{ metrics.totalWebtools }}</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow">
        <h3 class="text-md font-semibold text-gray-700 mb-2">Total Users</h3>
        <p class="text-2xl font-bold text-blue-600">{{ metrics.totalUsers }}</p>
      </div>

    </div>

    <!-- Main Analytics Section -->
    <div class="space-y-6 mx-4 md:mx-8 mb-8">
      <!-- Webtool Usage Overview -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Webtool Usage Chart -->
        <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
          <h3 class="text-lg font-semibold text-gray-700 mb-4">Total Users per Webtool</h3>
          <apx-chart
            *ngIf="filteredWebtoolUsageChart?.series?.length"
            [series]="filteredWebtoolUsageChart.series"
            [chart]="filteredWebtoolUsageChart.chart"
            [xaxis]="filteredWebtoolUsageChart.xaxis"
            [plotOptions]="filteredWebtoolUsageChart.plotOptions"
            [colors]="['#0077B6']">
          </apx-chart>
        </div>

        <!-- Department Distribution -->
        <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
          <h3 class="text-lg font-semibold text-gray-700 mb-4">Users by Department</h3>
          <apx-chart
            *ngIf="filteredDepartmentDistributionChart"
            [series]="filteredDepartmentDistributionChart.series"
            [chart]="filteredDepartmentDistributionChart.chart"
            [labels]="filteredDepartmentDistributionChart.labels"
            [colors]="['#0077B6', '#556FB5', '#3B82F6', '#1D4ED8', '#1E40AF']">
          </apx-chart>
        </div>
      </div>


      <!-- User Access Patterns -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- User-Webtool Matrix -->
        <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
          <h3 class="text-lg font-semibold text-gray-700 mb-4">User Webtool Access Matrix</h3>
          <apx-chart
            *ngIf="filteredUserWebtoolMatrix"
            [series]="filteredUserWebtoolMatrix.series"
            [chart]="filteredUserWebtoolMatrix.chart"
            [dataLabels]="filteredUserWebtoolMatrix.dataLabels"
            [colors]="['#E5E7EB', '#0077B6']"
            [xaxis]="filteredUserWebtoolMatrix.xaxis"
            [tooltip]="filteredUserWebtoolMatrix.tooltip">
          </apx-chart>
        </div>

        <!-- Top Users Chart -->
        <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
          <h3 class="text-lg font-semibold text-gray-700 mb-4">Top Users by Webtool Access</h3>
          <apx-chart
            *ngIf="filteredTopUsersChart"
            [series]="filteredTopUsersChart.series"
            [chart]="filteredTopUsersChart.chart"
            [plotOptions]="filteredTopUsersChart.plotOptions"
            [xaxis]="filteredTopUsersChart.xaxis"
            [colors]="['#0077B6']"
            [tooltip]="filteredTopUsersChart.tooltip">
          </apx-chart>
        </div>
      </div>

      <!-- Department-Specific Analytics -->
      <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
        <h3 class="text-lg font-semibold text-gray-700 mb-4">Department Composition in Each Webtool</h3>
        <apx-chart
          *ngIf="filteredDepartmentUsageChart"
          [series]="filteredDepartmentUsageChart.series"
          [chart]="filteredDepartmentUsageChart.chart"
          [xaxis]="filteredDepartmentUsageChart.xaxis"
          [colors]="['#0077B6', '#556FB5', '#3B82F6', '#1D4ED8', '#1E40AF']">
        </apx-chart>
      </div>



    </div>
  </ng-container>
</div>
