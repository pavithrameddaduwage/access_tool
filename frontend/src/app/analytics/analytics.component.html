<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
    <!-- Dashboard Toggle -->
    <div class="flex justify-center pt-8">
      <div class="relative inline-flex rounded-xl shadow-lg bg-white p-1 border border-gray-200" role="group">
        <!-- Animated background for active state -->
        <div 
          class="absolute inset-y-0 left-0 h-full bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg transition-all duration-300 ease-in-out"
          [style.left]="activeDashboard === 'powerbi' ? '0.25rem' : 'calc(50% + 0.25rem)'"
          [style.width]="'calc(50% - 0.5rem)'"
        ></div>
        
        <button
          type="button"
          (click)="toggleDashboard('powerbi')"
          class="relative px-6 py-3 text-sm font-medium rounded-lg border-0 transition-all duration-200 w-32 focus:outline-none"
          [class.text-white]="activeDashboard === 'powerbi'"
          [class.text-gray-700]="activeDashboard !== 'powerbi'"
        >
          <span class="relative z-10 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            PowerBI
          </span>
        </button>
        
        <button
          type="button"
          (click)="toggleDashboard('webtool')"
          class="relative px-6 py-3 text-sm font-medium rounded-lg border-0 transition-all duration-200 w-32 focus:outline-none"
          [class.text-white]="activeDashboard === 'webtool'"
          [class.text-gray-700]="activeDashboard !== 'webtool'"
        >
          <span class="relative z-10 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Webtool
          </span>
        </button>
      </div>
    </div>
  
    <!-- Dashboard Content -->
    <div class="px-4 py-8">
      <div *ngIf="activeDashboard === 'powerbi'" class="animate-fade-in">
        <app-powerbi-dashboard></app-powerbi-dashboard>
      </div>
      <div *ngIf="activeDashboard === 'webtool'" class="animate-fade-in">
        <app-webtool-analytics></app-webtool-analytics>
      </div>
    </div>
  </div>
