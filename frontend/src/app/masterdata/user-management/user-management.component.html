<div class="um-wrap">

  <!-- ── Page Header ── -->
  <div class="um-header">
    <div>
      <h1 class="um-title">User Management</h1>
      <p class="um-subtitle">Manage portal user accounts and role assignments</p>
    </div>
    <button class="um-add-btn" (click)="openForm('add')">
      <svg xmlns="http://www.w3.org/2000/svg" class="um-add-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Add User
    </button>
  </div>

  <!-- Controls: search + filter -->
  <div class="um-controls">
    <div class="um-controls-left">
      <input type="text" placeholder="Filter users by email or name" class="um-table-search" [(ngModel)]="userFilterQuery" />
      <label class="um-controls-switch">
        <input type="checkbox" [(ngModel)]="showOnlyActive" />
        <span>Active only</span>
      </label>
    </div>
    <div class="um-controls-right">&nbsp;</div>
  </div>

  <!-- ── Users Table ── -->
  <div class="um-card">
    <div class="um-table-wrap">
      <table class="um-table">
        <thead>
          <tr>
            <th class="um-th">Email</th>
            <th class="um-th">Name</th>
            <th class="um-th">Roles</th>
            <th class="um-th um-th--center">Active</th>
            <th class="um-th um-th--center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers; let odd = odd" class="um-row" [class.um-row--stripe]="odd">
            <td class="um-td um-td--email">{{ user?.email }}</td>
            <td class="um-td um-td--name">{{ user?.name }}</td>
            <td class="um-td">
              <div class="um-roles">
                <span
                  *ngFor="let userRole of user.user_roles"
                  class="um-role-badge"
                  [class.um-role-badge--admin]="userRole.role.role === 'admin'"
                >
                  <span class="um-role-dot" [class.um-role-dot--admin]="userRole.role.role === 'admin'"></span>
                  {{ userRole.role.role }}
                </span>
              </div>
            </td>
            <td class="um-td um-td--center">
              <label class="um-toggle">
                <input
                  type="checkbox"
                  [checked]="user?.is_active"
                  (change)="updateStatus(user?.id || 0, $event)"
                  class="um-toggle-input"
                />
                <span class="um-toggle-track"></span>
              </label>
            </td>
            <td class="um-td um-td--center">
              <div class="um-actions">
                <button class="um-icon-btn um-icon-btn--edit" (click)="editUser(user)" title="Edit">
                  <svg xmlns="http://www.w3.org/2000/svg" class="um-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                </button>
                <button class="um-icon-btn um-icon-btn--del" (click)="deleteUser(user.id)" title="Delete">
                  <svg xmlns="http://www.w3.org/2000/svg" class="um-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ══════════ Modal ══════════ -->
<div *ngIf="showModal" class="um-modal-backdrop" (click)="closeModal()">
  <div class="um-modal" (click)="$event.stopPropagation()">

    <!-- Modal header -->
    <div class="um-modal-head">
      <h2 class="um-modal-title">{{ editMode ? 'Edit User' : 'Add New User' }}</h2>
      <button class="um-modal-close" (click)="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" class="um-close-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal body -->
    <div class="um-modal-body">

      <!-- AD Search (add mode only) -->
      <div class="um-field" *ngIf="!editMode">
        <label class="um-label">Search User</label>
        <div class="um-search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" class="um-search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            class="um-search-input"
            type="text"
            placeholder="Search AD users…"
            (input)="onUserSearch($event)"
            [readonly]="editMode"
          />
          <div *ngIf="isSearching" class="um-search-spinner"></div>
        </div>
        <!-- AD results dropdown -->
        <div *ngIf="adUsers.length > 0" class="um-ad-results">
          <div
            *ngFor="let user of adUsers"
            class="um-ad-result"
            (click)="selectADUser(user)"
          >
            <div class="um-ad-name">{{ user.name }}</div>
            <div class="um-ad-email">{{ user.email }}</div>
          </div>
        </div>
      </div>

      <!-- Email (read-only) -->
      <div class="um-field">
        <label class="um-label">Email</label>
        <input type="email" class="um-readonly-input" [value]="selectedUser?.email" readonly />
      </div>

      <!-- Name (read-only) -->
      <div class="um-field">
        <label class="um-label">Name</label>
        <input type="text" class="um-readonly-input" [value]="selectedUser?.name" readonly />
      </div>

      <!-- Roles -->
      <div class="um-field">
        <label class="um-label">Roles</label>
        <div class="um-roles-list">
          <label *ngFor="let role of roles" class="um-role-check">
            <input
              type="checkbox"
              class="um-check"
              [checked]="isRoleSelected(role.id)"
              (change)="toggleRole(role.id)"
            />
            <span class="um-check-label">{{ role.role }}</span>
          </label>
        </div>
      </div>

      <!-- Selected role pills -->
      <div class="um-selected-roles">
        <span
          *ngFor="let roleId of selectedRoles"
          class="um-role-pill"
          [class.um-role-pill--admin]="getRoleById(roleId)?.role === 'admin'"
        >
          {{ getRoleById(roleId)?.role }}
          <button class="um-pill-remove" (click)="toggleRole(roleId)">×</button>
        </span>
      </div>

    </div><!-- /modal-body -->

    <!-- Modal footer -->
    <div class="um-modal-foot">
      <button class="um-cancel-btn" type="button" (click)="closeModal()">Cancel</button>
      <button class="um-save-btn" type="button" (click)="saveUser()">
        {{ editMode ? 'Update' : 'Add' }} User
      </button>
    </div>

  </div>
</div>
