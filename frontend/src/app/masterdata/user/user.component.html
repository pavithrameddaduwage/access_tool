<div class="mu-wrap">

  <!-- ── Add User Accordion ── -->
  <div class="mu-accordion">
    <button class="mu-accordion-btn" (click)="toggleForm()">
      <span class="mu-accordion-label">
        <svg xmlns="http://www.w3.org/2000/svg" class="mu-accordion-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add User
      </span>
      <span class="mu-accordion-chevron" [class.mu-accordion-chevron--open]="isFormOpen">▼</span>
    </button>

    <!-- Form panel -->
    <div *ngIf="isFormOpen" class="mu-form-panel">
      <form class="mu-form">

        <!-- AD search -->
        <div class="mu-field">
          <label class="mu-label">Username Search</label>
          <div class="mu-search-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" class="mu-search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              class="mu-search-input"
              id="username"
              type="text"
              [(ngModel)]="editForm.username"
              name="username"
              placeholder="Start typing to search AD users…"
              (input)="onUsernameSearch($event)"
            />
            <div *ngIf="isSearching" class="mu-search-spinner"></div>
          </div>
          <!-- AD results -->
          <div *ngIf="adUsers.length > 0" class="mu-ad-results">
            <div *ngFor="let user of adUsers" class="mu-ad-result" (click)="selectADUser(user)">
              <div class="mu-ad-name">{{ user.name }}</div>
              <div class="mu-ad-email">{{ user.email }}</div>
              <div class="mu-ad-dept">{{ user.department }}</div>
            </div>
          </div>
        </div>

        <!-- Name -->
        <div class="mu-field">
          <label class="mu-label" for="name">Name</label>
          <input
            class="mu-input"
            [class.mu-input--filled]="editForm.name"
            id="name"
            type="text"
            [(ngModel)]="editForm.name"
            name="name"
            placeholder="Auto-fills from AD"
            [readonly]="editForm.name"
          />
        </div>

        <!-- Email -->
        <div class="mu-field">
          <label class="mu-label" for="email">Email</label>
          <input
            class="mu-input"
            [class.mu-input--filled]="editForm.email"
            id="email"
            type="email"
            [(ngModel)]="editForm.email"
            name="email"
            placeholder="Auto-fills from AD"
            [readonly]="editForm.email"
          />
        </div>

        <!-- Department -->
        <div class="mu-field">
          <label class="mu-label" for="department">Department</label>
          <p-dropdown
            [options]="departments"
            optionLabel="department"
            optionValue="id"
            [(ngModel)]="editForm.departmentId"
            name="department"
            [filter]="true"
            filterBy="department"
            [showClear]="true"
            placeholder="Select Department"
          ></p-dropdown>
        </div>

        <!-- Actions -->
        <div class="mu-form-actions">
          <button *ngIf="selectedRowIndex !== null" class="mu-save-btn" type="button" (click)="saveEditedUser()">Save</button>
          <button *ngIf="!selectedRowIndex" class="mu-save-btn" type="button" (click)="onAddUser()">Add User</button>
        </div>

      </form>
    </div>
  </div>

  <!-- ── Users Table ── -->
  <div class="mu-card">
    <!-- Search -->
    <div class="mu-card-top">
      <div class="mu-table-search-wrap">
        <svg class="mu-table-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
        </svg>
        <input type="text" class="mu-table-search" placeholder="Search users…" />
      </div>
    </div>

    <div class="mu-table-wrap">
      <table class="mu-table">
        <thead>
          <tr>
            <th class="mu-th">Name</th>
            <th class="mu-th">Email</th>
            <th class="mu-th">Department</th>
            <th class="mu-th mu-th--center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users; let i = index" class="mu-row">
            <td class="mu-td">
              <div class="mu-user-cell">
                <app-avatar [name]="user.name"></app-avatar>
                <span>{{ user.name }}</span>
              </div>
            </td>
            <td class="mu-td">{{ user.email }}</td>
            <td class="mu-td">
              <span class="mu-dept-tag">{{ user.department?.department }}</span>
            </td>
            <td class="mu-td mu-td--center">
              <div class="mu-actions">
                <button class="mu-icon-btn mu-icon-btn--edit" (click)="onEdit(user, i)" title="Edit">
                  <svg xmlns="http://www.w3.org/2000/svg" class="mu-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                </button>
                <button class="mu-icon-btn mu-icon-btn--del" (click)="onDelete(user)" title="Delete">
                  <svg xmlns="http://www.w3.org/2000/svg" class="mu-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
