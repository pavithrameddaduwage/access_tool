<div class="login-page">
  <div class="login-card">

    <!-- Logo / Brand -->
    <div class="login-header">
      <img src="assets/horizontal-blue-hgu-logo.png" class="login-logo" alt="HGU Logo" />
      <h1 class="login-title">Access Tool</h1>
      <p class="login-subtitle">Sign in to continue</p>
    </div>

    <!-- Form -->
    <form [formGroup]="formGroup" (ngSubmit)="handleSubmit()" class="login-form">

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <i class="pi pi-envelope input-icon"></i>
          <input
            id="email"
            type="email"
            placeholder="name@company.com"
            formControlName="email"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="pi pi-lock input-icon"></i>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            formControlName="password"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="formGroup.invalid">
        Sign in
      </button>

    </form>

    <p class="login-footer">Powered by MIS Team</p>
  </div>
</div>
